# Alembic configuration for the AI-Study-Assistant database.
#
# This file intentionally contains no credentials. Runtime code
# (``helpers/migrations.py`` and ``alembic/env.py``) supplies the database URL
# from application settings or an explicit override.
#
# Developer CLI usage (from the repository root, with src/.env configured):
#   python -m alembic -c src/models/db_schemes/minirag/alembic.ini upgrade head

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = postgresql+psycopg2://localhost/postgres

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
