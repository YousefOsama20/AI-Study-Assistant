appId: com.aistudyassistant.app
productName: AI-Study-Assistant
copyright: Copyright © 2026 AI-Study-Assistant contributors

directories:
  output: dist
  buildResources: assets

files:
  - electron/dist/**/*
  - electron/package.json
  - build/renderer/**/*
  - package.json

extraResources:
  - from: build/backend
    to: backend
    filter:
      - "**/*"
  - from: ../docker/docker-compose.yml
    to: docker/docker-compose.yml

asar: true
compression: normal

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico
  artifactName: AI-Study-Assistant Setup ${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AI-Study-Assistant
  uninstallDisplayName: AI-Study-Assistant
  deleteAppDataOnUninstall: false
