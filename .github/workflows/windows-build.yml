name: Windows build

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Test and package
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Type-check
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

      - name: Compile backend
        run: python -m compileall -q src

      - name: Run backend unit tests
        working-directory: src
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build bundled backend
        working-directory: frontend
        run: powershell -ExecutionPolicy Bypass -File scripts/build-backend.ps1 -Python python

      - name: Build renderer and Electron main process
        working-directory: frontend
        run: |
          npm run build
          npm run build:electron

      - name: Package Windows installer
        working-directory: frontend
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --publish never

      - name: Verify packaged resources
        working-directory: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $unpacked = Join-Path $PWD "dist\win-unpacked"
          $required = @(
            (Join-Path $unpacked "AI-Study-Assistant.exe"),
            (Join-Path $unpacked "resources\backend\AIStudyAssistantBackend.exe"),
            (Join-Path $unpacked "resources\docker\docker-compose.yml")
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing packaged file: $path" }
          }

      - name: Write checksums
        working-directory: frontend
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist\AI-Study-Assistant Setup *.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer was not produced." }
          $hash = (Get-FileHash -Algorithm SHA256 -Path $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content "dist\SHA256SUMS.txt" -Encoding ASCII
          Get-Content "dist\SHA256SUMS.txt"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            frontend/dist/AI-Study-Assistant Setup *.exe
            frontend/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-logs
          path: |
            frontend/build/pyinstaller/*.log
            frontend/dist/*.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: true

